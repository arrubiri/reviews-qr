<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirigiendo…</title>
<style>
  body{
    margin:0;
    background:#EDEEE6;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color:#20241F;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    text-align:center;
  }
  .box{ max-width:340px; }
  .spinner{
    width:32px;height:32px;
    border:3px solid #E2E1D6;
    border-top-color:#C9982E;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin:0 auto 18px;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  h1{ font-size:17px; margin:0 0 8px; font-weight:600; }
  p{ font-size:14px; color:#565E54; margin:0; line-height:1.5; }
</style>
</head>
<body>

  <div class="box">
    <div class="spinner"></div>
    <h1>Cargando…</h1>
    <p id="msg">Redirigiendo a la página del negocio.</p>
  </div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby9u-uG8gN_fJkaLkSew9yl8L7sYDo-FE03X2oE9htLsInmpEJYPwQ3tlqW03QRiFtB_A/exec';
  const q = new URLSearchParams(window.location.search).get('q');

  function mostrarMensaje(texto){
    document.getElementById('msg').textContent = texto;
    document.querySelector('.spinner').style.display = 'none';
  }

  async function redirigir(){
    if (!q) {
      mostrarMensaje('Falta el código del QR en el enlace.');
      return;
    }
    try {
      const res = await fetch(APPS_SCRIPT_URL + '?q=' + encodeURIComponent(q));
      const data = await res.json();
      if (!data.ok) {
        mostrarMensaje('Este QR todavía no está activado. Avisa al negocio.');
        return;
      }
      window.location.href = 'https://arrubiri.github.io/reviews-qr/landing.html?n=' + encodeURIComponent(data.slug);
    } catch (e) {
      console.error(e);
      mostrarMensaje('No se ha podido conectar. Inténtalo de nuevo.');
    }
  }

  redirigir();
</script>

</body>
</html>
