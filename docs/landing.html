<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>¿Qué tal tu visita? — Acelera tu reseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:      #EDEEE6;
    --card:       #FFFFFF;
    --ink:        #20241F;
    --ink-soft:   #565E54;
    --teal:       #3E6259;
    --teal-dim:   #DDE6E2;
    --green:      #3E8A57;
    --line:       #E2E1D6;
    --radius:     18px;
    --accent:     #C9982E;
    --accent-dim: #E7DCC2;
    --accent-text:#8A6A1E;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 18px;
    min-height:100vh;
    gap:24px;
    transition:background 300ms ease;
  }

  .marca-top{ text-align:center; }
  .marca-top img{
    height:200px;
    width:auto;
    display:block;
    margin:0 auto;
  }
  .marca-top .marca-nombre{
    display:block;
    font-family:'Newsreader', serif;
    font-size:20px;
    font-weight:500;
    color:var(--ink);
    margin-top:-20px;
    letter-spacing:-0.01em;
  }
  .marca-top .marca-claim{
    display:block;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--card);
    border-radius:var(--radius);
    padding:36px 28px 30px;
    box-shadow:0 1px 2px rgba(32,36,31,0.04), 0 12px 32px -16px rgba(32,36,31,0.18);
    border:1px solid var(--line);
  }

  .business{ text-align:center; margin-bottom:22px; }
  .business .emoji{ font-size:34px; display:block; margin-bottom:10px; }
  .business h1{
    font-family:'Newsreader', serif;
    font-weight:500;
    font-size:26px;
    line-height:1.15;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .business p{
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0 0 8px;
    line-height:1.5;
  }

  .action{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    padding:15px 18px;
    border-radius:12px;
    box-sizing:border-box;
    margin-bottom:10px;
    border:1px solid transparent;
    cursor:pointer;
  }
  .action-primary.amber{
    background:var(--accent);
    color:#fff;
    font-weight:600;
    font-size:16px;
  }
  .action-primary.teal{
    background:var(--teal);
    color:#fff;
    font-weight:600;
  }
  .action:disabled{ opacity:0.6; cursor:wait; }

  .step-2{ display:none; }
  .step-2.active{ display:block; animation:rise 220ms ease; }
  .step-1.hidden{ display:none; }

  .gracias-screen{
    display:none;
    text-align:center;
    animation:rise 260ms ease;
  }
  .gracias-screen.active{ display:block; }
  .gracias-screen .emoji-grande{
    font-size:64px;
    display:block;
    margin-bottom:14px;
  }
  .gracias-screen h2{
    font-family:'Newsreader', serif;
    font-weight:500;
    font-size:28px;
    margin:0 0 12px;
    letter-spacing:-0.01em;
  }
  .gracias-screen p{
    color:var(--ink-soft);
    font-size:15px;
    line-height:1.55;
    margin:0;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .form-textarea{
    width:100%;
    min-height:120px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14.5px;
    color:var(--ink);
    resize:vertical;
    margin-bottom:10px;
    background:#fff;
  }
  .form-textarea:focus{ outline:2px solid var(--accent-dim); border-color:var(--accent); }
  .form-textarea::placeholder{ color:#9BA096; font-style:italic; }

  .other-suggestion{
    background:none;
    border:none;
    padding:0;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px;
    font-weight:600;
    color:var(--accent-text);
    cursor:pointer;
    text-decoration:underline;
    display:block;
    margin:0 0 16px auto;
  }

  .footer-note{
    text-align:center;
    font-size:11.5px;
    color:#9BA096;
    margin-top:22px;
  }

  .toast{
    position:fixed;
    left:50%;
    top:32px;
    transform:translateX(-50%) translateY(-20px);
    background:var(--green);
    color:#fff;
    font-size:17px;
    font-weight:600;
    padding:16px 26px;
    border-radius:12px;
    box-shadow:0 12px 32px -8px rgba(62,138,87,0.4);
    opacity:0;
    pointer-events:none;
    transition:opacity 260ms ease, transform 260ms ease;
    max-width:90vw;
    text-align:center;
    z-index:100;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce){
    .step-2.active, .gracias-screen.active{ animation:none; }
    body{ transition:none; }
  }

  @media (max-width:520px){
    .marca-top img{ height:150px; }
    .marca-top .marca-nombre{ font-size:18px; margin-top:-14px; }
    .marca-top .marca-claim{ font-size:12px; }
  }
</style>
</head>
<body>

  <div class="marca-top">
    <img src="logo.png" alt="Acelera tu reseña">
    <span class="marca-nombre">Acelera tu reseña</span>
    <span class="marca-claim">Más reseñas, menos esfuerzo</span>
  </div>

  <div class="card">
    <div class="business">
      <span class="emoji" id="bizEmoji">☕</span>
      <h1 id="bizName">Cargando…</h1>
      <p>¿Qué tal tu experiencia hoy? Nos ayuda muchísimo saberlo.</p>
    </div>

    <div class="step-1" id="step1">
      <button type="button" id="otherSuggestion" class="other-suggestion">Otra sugerencia</button>
      <textarea id="feedbackText" class="form-textarea"></textarea>
      <button type="button" id="continuar" class="action action-primary amber">
        Copiar y continuar
      </button>
    </div>

    <div class="step-2" id="step2">
      <a href="#" id="googleLink" target="_blank" rel="noopener" class="action action-primary amber">
        Dejar reseña en Google
      </a>
      <button type="button" id="sendPrivate" class="action action-primary teal">
        Enviarlo al negocio en privado
      </button>
    </div>

    <div class="gracias-screen" id="graciasScreen">
      <span class="emoji-grande">🎉</span>
      <h2>¡Gracias por tu comentario!</h2>
      <p>Tu opinión ayuda a mejorar el servicio.</p>
    </div>

    <div class="footer-note">Tu opinión solo se usa para mejorar. Gracias por tu tiempo.</div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  let CONFIG = null;
  let COMENTARIOS = null;
  let textoCliente = '';
  let sugerenciaActual = '';

  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby9u-uG8gN_fJkaLkSew9yl8L7sYDo-FE03X2oE9htLsInmpEJYPwQ3tlqW03QRiFtB_A/exec';
  const TOKEN_SECRETO = '69e39400-cb07-46a4-a0cb-5dea19c52612';

  const COLORES_CATEGORIA = {
    'hosteleria':               { paper: '#EDEEE6', accent: '#C9982E', dim: '#E7DCC2', text: '#8A6A1E' },
    'automocion':               { paper: '#E3E8EF', accent: '#1F3A5F', dim: '#D3DCE8', text: '#1F3A5F' },
    'belleza':                  { paper: '#F7E8EE', accent: '#C45B7F', dim: '#F0D6DF', text: '#A14263' },
    'gimnasio':                 { paper: '#F3E3E0', accent: '#B33A2E', dim: '#EBD0CC', text: '#B33A2E' },
    'salud':                    { paper: '#E6F0E9', accent: '#3E8A57', dim: '#D5E6DB', text: '#2E6B42' },
    'retail':                   { paper: '#EDE6F5', accent: '#7A5CA8', dim: '#E1D8F0', text: '#5E4685' },
    'veterinaria':              { paper: '#E1EFE9', accent: '#2E7D5C', dim: '#D2E5DE', text: '#22644A' },
    'informatica':              { paper: '#E2EDF8', accent: '#2E6FBA', dim: '#D3E1F0', text: '#255F9E' },
    'fontaneria_electricidad':  { paper: '#F8EBDD', accent: '#D87A2A', dim: '#F3DDC9', text: '#B56216' },
    'academia':                 { paper: '#E6EFF9', accent: '#4A85C7', dim: '#D6E4F3', text: '#3B6EA5' },
    'inmobiliaria':             { paper: '#EBEEDD', accent: '#6B7A3A', dim: '#DFE4CC', text: '#56632F' },
    'alimentacion':             { paper: '#E8EEDD', accent: '#5E7B3D', dim: '#DAE2C9', text: '#4B6331' },
    'generico':                 { paper: '#EDEEE6', accent: '#C9982E', dim: '#E7DCC2', text: '#8A6A1E' }
  };

  function aplicarColorCategoria(categoria) {
    const c = COLORES_CATEGORIA[categoria] || COLORES_CATEGORIA['generico'];
    const root = document.documentElement.style;
    root.setProperty('--paper', c.paper);
    root.setProperty('--accent', c.accent);
    root.setProperty('--accent-dim', c.dim);
    root.setProperty('--accent-text', c.text);
  }

  function mostrarToast(mensaje){
    const toast = document.getElementById('toast');
    toast.textContent = mensaje;
    toast.classList.add('show');
    setTimeout(() => { toast.classList.remove('show'); }, 4000);
  }

  function registrarActividad(tipo, texto){
    if(!CONFIG) return;
    const params = new URLSearchParams({
      token: TOKEN_SECRETO,
      negocio: CONFIG.slug,
      tipo: tipo,
      texto: texto || ''
    });
    fetch(APPS_SCRIPT_URL + '?' + params.toString(), { mode: 'no-cors' }).catch(() => {});
  }

  function mostrarPantallaGracias(){
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('active');
    document.getElementById('graciasScreen').classList.add('active');
  }

  async function cargarNegocio() {
    const slug = new URLSearchParams(window.location.search).get('n');
    const card = document.querySelector('.card');

    if (!slug) {
      card.innerHTML = '<p style="text-align:center;color:var(--ink-soft)">Falta el identificador del negocio en el enlace.</p>';
      return;
    }

    let negocios;
    try {
      const res = await fetch('negocios.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      negocios = await res.json();
    } catch (e) {
      console.error('Error cargando negocios.json:', e);
      card.innerHTML = '<p style="text-align:center;color:var(--ink-soft)">No se ha podido cargar la información del negocio.</p>';
      return;
    }

    if (!negocios[slug]) {
      card.innerHTML = '<p style="text-align:center;color:var(--ink-soft)">Negocio no encontrado.</p>';
      return;
    }

    const n = negocios[slug];
    CONFIG = {
      slug: slug,
      businessName: n.business_name,
      emoji: n.emoji,
      category: n.category || 'generico',
      googleReviewUrl: n.google_review_url,
      ownerEmail: n.owner_email
    };

    aplicarColorCategoria(CONFIG.category);

    document.getElementById('bizName').textContent = CONFIG.businessName;
    document.getElementById('bizEmoji').textContent = CONFIG.emoji;
    document.getElementById('googleLink').href = CONFIG.googleReviewUrl;

    try {
      const res = await fetch('comentarios.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const banco = await res.json();
      COMENTARIOS = banco[CONFIG.category] || banco['generico'] || null;
    } catch (e) {
      console.error('Error cargando comentarios.json:', e);
      COMENTARIOS = null;
    }

    mostrarNuevaSugerenciaAlta();
  }

  cargarNegocio();

  function fraseAleatoria(nivel){
    if(!COMENTARIOS || !COMENTARIOS[nivel] || !COMENTARIOS[nivel].length) return '';
    const lista = COMENTARIOS[nivel];
    return lista[Math.floor(Math.random() * lista.length)];
  }

  function mostrarNuevaSugerenciaAlta(){
    sugerenciaActual = fraseAleatoria('alta') || 'Cuéntanos qué te ha gustado.';
    const ta = document.getElementById('feedbackText');
    ta.placeholder = 'Sugerencia de comentario: "' + sugerenciaActual + '"';
  }

  document.getElementById('otherSuggestion').addEventListener('click', mostrarNuevaSugerenciaAlta);

  document.getElementById('continuar').addEventListener('click', async () => {
    const textarea = document.getElementById('feedbackText');
    textoCliente = textarea.value.trim() || sugerenciaActual;

    if (textoCliente) {
      try {
        await navigator.clipboard.writeText(textoCliente);
        mostrarToast('✅ Comentario copiado, listo para pegar');
      } catch (e) {
        console.warn('No se pudo copiar:', e);
      }
    }

    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.add('active');
  });

  document.getElementById('googleLink').addEventListener('click', () => {
    registrarActividad('google', textoCliente);
    mostrarPantallaGracias();
  });

  document.getElementById('sendPrivate').addEventListener('click', async () => {
    if(!CONFIG) return;

    const btn = document.getElementById('sendPrivate');
    btn.disabled = true;
    btn.textContent = 'Enviando…';

    try {
      const params = new URLSearchParams({
        accion: 'privado',
        token: TOKEN_SECRETO,
        negocio: CONFIG.slug,
        nombre: CONFIG.businessName,
        email: CONFIG.ownerEmail,
        texto: textoCliente || '(Sin comentario)'
      });
      await fetch(APPS_SCRIPT_URL + '?' + params.toString(), { mode: 'no-cors' });
      registrarActividad('privada', textoCliente);
      mostrarPantallaGracias();
    } catch (e) {
      console.warn(e);
      btn.disabled = false;
      btn.textContent = 'Enviarlo al negocio en privado';
    }
  });
</script>

</body>
</html>
