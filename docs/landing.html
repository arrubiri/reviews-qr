<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>¿Qué tal tu visita?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:      #EDEEE6;
    --card:       #FFFFFF;
    --ink:        #20241F;
    --ink-soft:   #565E54;
    --amber:      #C9982E;
    --amber-dim:  #E7DCC2;
    --teal:       #3E6259;
    --teal-dim:   #DDE6E2;
    --line:       #E2E1D6;
    --radius:     18px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 18px;
    min-height:100vh;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--card);
    border-radius:var(--radius);
    padding:36px 28px 30px;
    box-shadow:0 1px 2px rgba(32,36,31,0.04), 0 12px 32px -16px rgba(32,36,31,0.18);
    border:1px solid var(--line);
  }

  .business{ text-align:center; margin-bottom:22px; }
  .business .emoji{ font-size:34px; display:block; margin-bottom:10px; }
  .business h1{
    font-family:'Newsreader', serif;
    font-weight:500;
    font-size:26px;
    line-height:1.15;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .business p{
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0 0 8px;
    line-height:1.5;
  }

  .suggestion-box{
    background:var(--amber-dim);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .suggestion-box .label{
    font-size:11.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:#8A6A1E;
    margin-bottom:6px;
  }
  .suggestion-box .text{
    font-size:14px;
    line-height:1.5;
    color:var(--ink);
    margin-bottom:10px;
  }
  .suggestion-actions{
    display:flex;
    gap:16px;
  }
  .suggestion-actions button{
    background:none;
    border:none;
    padding:0;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px;
    font-weight:600;
    color:#8A6A1E;
    cursor:pointer;
    text-decoration:underline;
  }

  .action{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    padding:15px 18px;
    border-radius:12px;
    box-sizing:border-box;
    margin-bottom:10px;
    border:1px solid transparent;
    cursor:pointer;
  }
  .action-primary.amber{
    background:var(--amber);
    color:#fff;
    font-weight:600;
    font-size:16px;
  }
  .action-primary.teal{
    background:var(--teal);
    color:#fff;
    font-weight:600;
  }

  .step-2{ display:none; }
  .step-2.active{ display:block; animation:rise 220ms ease; }
  .step-1.hidden{ display:none; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .form-textarea{
    width:100%;
    min-height:110px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14.5px;
    color:var(--ink);
    resize:vertical;
    margin-bottom:12px;
    background:#fff;
  }
  .form-textarea:focus{ outline:2px solid var(--amber-dim); border-color:var(--amber); }

  .footer-note{
    text-align:center;
    font-size:11.5px;
    color:#9BA096;
    margin-top:22px;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink);
    color:#fff;
    font-size:13.5px;
    font-weight:500;
    padding:12px 18px;
    border-radius:10px;
    box-shadow:0 8px 24px -8px rgba(0,0,0,0.4);
    opacity:0;
    pointer-events:none;
    transition:opacity 200ms ease, transform 200ms ease;
    max-width:90vw;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce){
    .step-2.active{ animation:none; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="business">
      <span class="emoji" id="bizEmoji">☕</span>
      <h1 id="bizName">Cargando…</h1>
      <p>¿Qué tal tu experiencia hoy? Nos ayuda muchísimo saberlo.</p>
    </div>

    <!-- ================================================ -->
    <!-- PASO 1: escribir (opcional) y continuar          -->
    <!-- ================================================ -->
    <div class="step-1" id="step1">

      <div class="suggestion-box">
        <div class="label">Sugerencia de reseña</div>
        <div class="text" id="suggestionText">Cargando sugerencia…</div>
        <div class="suggestion-actions">
          <button type="button" id="otherSuggestion">Otra sugerencia</button>
        </div>
      </div>

      <textarea id="feedbackText"
                class="form-textarea"
                placeholder="Cuéntanos qué tal tu experiencia... (o déjalo en blanco)"></textarea>

      <button type="button" id="continuar" class="action action-primary amber">
        Continuar
      </button>

    </div>

    <!-- ================================================ -->
    <!-- PASO 2: elegir dónde publicar                    -->
    <!-- ================================================ -->
    <div class="step-2" id="step2">
      <a href="#" id="googleLink" target="_blank" rel="noopener" class="action action-primary amber">
        Dejar reseña en Google
      </a>
      <button type="button" id="sendPrivate" class="action action-primary teal">
        Enviarlo al negocio en privado
      </button>
    </div>

    <div class="footer-note">Tu opinión solo se usa para mejorar. Gracias por tu tiempo.</div>
  </div>

  <div class="toast" id="mailToast">Se necesita una aplicación de correo instalada.</div>

<script>
  /* ============================================================
     CARGA DE DATOS DEL NEGOCIO
     ============================================================ */
  let CONFIG = null;
  let COMENTARIOS = null;
  let textoCliente = '';

  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby9u-uG8gN_fJkaLkSew9yl8L7sYDo-FE03X2oE9htLsInmpEJYPwQ3tlqW03QRiFtB_A/exec';
  const TOKEN_SECRETO = '69e39400-cb07-46a4-a0cb-5dea19c52612';

  function registrarActividad(tipo, texto){
    if(!CONFIG) return;
    const params = new URLSearchParams({
      token: TOKEN_SECRETO,
      negocio: CONFIG.slug,
      tipo: tipo,
      email: CONFIG.ownerEmail,
      texto: texto || ''
    });
    fetch(APPS_SCRIPT_URL + '?' + params.toString(), { mode: 'no-cors' }).catch(() => {});
  }

  async function cargarNegocio() {
    const slug = new URLSearchParams(window.location.search).get('n');
    const card = document.querySelector('.card');

    if (!slug) {
      card.innerHTML = '<p style="text-align:center;color:var(--ink-soft)">Falta el identificador del negocio en el enlace.</p>';
      return;
    }

    let negocios;
    try {
      const res = await fetch('negocios.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      negocios = await res.json();
    } catch (e) {
      console.error('Error cargando negocios.json:', e);
      card.innerHTML = '<p style="text-align:center;color:var(--ink-soft)">No se ha podido cargar la información del negocio.</p>';
      return;
    }

    if (!negocios[slug]) {
      card.innerHTML = '<p style="text-align:center;color:var(--ink-soft)">Negocio no encontrado.</p>';
      return;
    }

    const n = negocios[slug];
    CONFIG = {
      slug: slug,
      businessName: n.business_name,
      emoji: n.emoji,
      category: n.category || 'generico',
      googleReviewUrl: n.google_review_url,
      ownerEmail: n.owner_email
    };

    document.getElementById('bizName').textContent = CONFIG.businessName;
    document.getElementById('bizEmoji').textContent = CONFIG.emoji;
    document.getElementById('googleLink').href = CONFIG.googleReviewUrl;

    try {
      const res = await fetch('comentarios.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const banco = await res.json();
      COMENTARIOS = banco[CONFIG.category] || banco['generico'] || null;
    } catch (e) {
      console.error('Error cargando comentarios.json:', e);
      COMENTARIOS = null;
    }

    mostrarNuevaSugerenciaAlta();
  }

  cargarNegocio();

  /* ---- Sugerencias ---- */
  function fraseAleatoria(nivel){
    if(!COMENTARIOS || !COMENTARIOS[nivel] || !COMENTARIOS[nivel].length) return '';
    const lista = COMENTARIOS[nivel];
    return lista[Math.floor(Math.random() * lista.length)];
  }

  function mostrarNuevaSugerenciaAlta(){
    const texto = fraseAleatoria('alta');
    document.getElementById('suggestionText').textContent = texto || 'Cuéntanos qué te ha gustado.';
  }

  document.getElementById('otherSuggestion').addEventListener('click', mostrarNuevaSugerenciaAlta);

  /* ---- Paso 1: Continuar ---- */
  document.getElementById('continuar').addEventListener('click', async () => {
    const textarea = document.getElementById('feedbackText');
    textoCliente = textarea.value.trim();

    // Copiar al portapapeles si hay texto
    if (textoCliente) {
      try {
        await navigator.clipboard.writeText(textoCliente);
      } catch (e) {
        console.warn('No se pudo copiar al portapapeles:', e);
      }
    }

    // Cambiar a paso 2
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.add('active');
  });

  /* ---- Paso 2: Google ---- */
  document.getElementById('googleLink').addEventListener('click', () => {
    registrarActividad('google', textoCliente);
  });

  /* ---- Paso 2: Privado (mailto) ---- */
  function mostrarToast(mensaje){
    const toast = document.getElementById('mailToast');
    toast.textContent = mensaje;
    toast.classList.add('show');
    setTimeout(() => { toast.classList.remove('show'); }, 3000);
  }

  document.getElementById('sendPrivate').addEventListener('click', () => {
    if(!CONFIG) return;

    const subject = encodeURIComponent('Comentario de un cliente — ' + CONFIG.businessName);
    const body = encodeURIComponent(textoCliente || '(Sin comentario)');
    window.location.href = `mailto:${CONFIG.ownerEmail}?subject=${subject}&body=${body}`;
    registrarActividad('privada', textoCliente);

    setTimeout(() => {
      if (document.visibilityState === 'visible' && document.hasFocus()) {
        mostrarToast('Se necesita una aplicación de correo instalada.');
      }
    }, 1000);
  });
</script>

</body>
</html>
